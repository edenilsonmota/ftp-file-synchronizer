[package]
name = "ftp-file-synchronizer"
description = "Ferramenta de sincronização FTP automática"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
interprocess = "2.4.7"
log = "0.4.35"
open = "5.4.5"
png = "0.18"
rfd = "0.17.2"
# `~`: o módulo `winit_030` (foco da janela ao voltar da bandeja) pode mudar em versões menores.
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
sync-core = { path = "../sync-core" }
sys-locale = "0.3.2"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3.27.0"

# Ícone na bandeja: StatusNotifierItem via D-Bus no Linux (sem GTK), APIs nativas no Windows e macOS.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }

# Instaladores gerados por `cargo packager --release` (Windows, Linux e macOS).
#
# No Linux, o nome do arquivo .desktop, o nome dos ícones em hicolor e o
# `app_id`/`WM_CLASS` da janela são todos `ftp-file-synchronizer`
# (`sync_core::APP_ID`). Manter os três iguais é o que faz o ícone aparecer
# corretamente em qualquer ambiente (GNOME, KDE, Hyprland, X11 ou Wayland).
[package.metadata.packager]
product-name = "FTP File Synchronizer"
identifier = "com.edenilson.ftpfilesynchronizer"
publisher = "Edenilson Mota"
category = "DeveloperTool"
out-dir = "../../dist"
icons = [
    "../../assets/icons/16x16.png",
    "../../assets/icons/24x24.png",
    "../../assets/icons/32x32.png",
    "../../assets/icons/48x48.png",
    "../../assets/icons/64x64.png",
    "../../assets/icons/96x96.png",
    "../../assets/icons/128x128.png",
    "../../assets/icons/256x256.png",
    "../../assets/icons/512x512.png",
    "../../assets/icon.ico",
]

[package.metadata.packager.deb]
desktop-template = "../../assets/linux/desktop.hbs"
depends = ["libxkbcommon0", "libfontconfig1"]

[package.metadata.packager.pacman]
depends = ["libxkbcommon", "fontconfig"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
